# Real-data manifest template for benchmarks/benchmark_real.py (round-7.6).
#
# One YAML file = one dataset. The script reads ``main``, ``replicates``,
# ``config`` (algorithm parameters), and ``description`` (free-form metadata).
# Schema is locked at docs/03 §1.12.
#
# Data files live OUTSIDE the repository (under D:/stem/benchmark_data/) so
# private/proprietary data does not enter version control. The benchmark
# script copies Java's genetable/profiletable into
# benchmarks/results/real/<UTCts>_real/ for archival.
#
# Run:
#   pip install -e ".[benchmark]"     # PyYAML>=6,<7 (optional dep)
#   python benchmarks/benchmark_real.py --manifest D:/stem/benchmark_data/<id>/manifest.yaml

id: R1_my_timecourse
main: D:/stem/benchmark_data/R1/main.txt
replicates:
  # - D:/stem/benchmark_data/R1/rep1.txt
  # - D:/stem/benchmark_data/R1/rep2.txt

config:
  # All algorithm parameters. Fields not listed here are passed through
  # to both Java and PySTEMTC with the same STEM-compatible default; the
  # schema is the *minimum* explicit surface; round-7.6 review confirms
  # defaults are applied identically to both languages via cfg.get(...).
  normalize: log                       # log | normalize | none_add0
  max_unit_change: 2
  max_model_profiles: 50
  max_correlation: 1.0
  candidate_cap: 1000000
  n_permutations: 50
  permute_t0: true
  # correction: bonferroni | fdr | none
  correction: bonferroni
  max_missing: 0
  min_abs_expr: 1.0
  # repeat_mode: different_periods | same_period
  repeat_mode: different_periods
  spot_included: true
  # clustering_method: stem | kmeans
  clustering_method: stem
  # round-7.5 P1-3: previously hardcoded in the Java config renderer;
  # now driven from manifest (defaults below match STEM v1.3.14).
  repeat_min_correlation: 0.0          # Minimum_Correlation_between_Repeats
  cluster_min_correlation: 0.7         # Clustering_Minimum_Correlation
  cluster_corr_percentile: 0.0         # Clustering_Minimum_Correlation_Percentile
  alpha: 0.05                          # Significance_Level
  change_rule: max_minus_min           # Change_should_be_based_on

description:
  organism: optional
  assay: optional
  # Free-text provenance / preprocessing recipe. Anything human-readable
  # goes here. The benchmark harness surfaces this in summary.md.
  preprocessing: derived from D:/stem/testdata/stem.testdata.tsv by selecting Brain columns in biological order
  # SHA256 of the upstream raw tsv (provenance one level up). Optional
  # but recommended; absence shows as "(not provided)" in summary.md.
  source_sha256: 9e6dba16d1dcfcb4ea39226066e7c3bc53c0175888122134e8357285cef54514
  # analysis_input_sha256 is what the engine actually reads (main.txt on
  # disk). The harness re-hashes it at run time, so this is documented
  # here for cross-checking, not consumed directly.
  analysis_input_sha256: ef8e6ae3915c50bcef518d737b915e9e36d83bb2bb02c59cf643b27a105a45ac
