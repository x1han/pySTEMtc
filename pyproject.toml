[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pystemtc"
version = "0.1.0"
description = "pySTEMTC - headless Python-compatible implementation of the STEM v1.3.14 time-course core"
requires-python = ">=3.11"
license = { text = "GPL-3.0" }
dependencies = [
    "numpy>=2.4,<3",  # provisional per round-6 ruling — freeze after 3.11 CI green
    "pandas>=3.0,<4",  # provisional per round-6 ruling — freeze after 3.11 CI green
]

[project.scripts]
pystemtc = "pystemtc.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
# benchmark_real.py needs PyYAML for the YAML manifest. Kept out of the
# core runtime dependency so PyPI installs don't pull it in for users who
# only want the analysis engine.
benchmark = ["PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
