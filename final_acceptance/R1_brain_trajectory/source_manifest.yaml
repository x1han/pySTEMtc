# R1 manifest -- Brain trajectory T=7 across mouse development
# (FINAL-A round-1: schema renamed; old input_sha256/derivation_sha256
#  replaced by source_sha256 + analysis_input_sha256 per spec)
#
# Run:
#   python benchmarks/benchmark_real.py --manifest verification/R1_manifest.yaml
# or:
#   pystemtc run --config R1_defaults.txt --output results/R1

id: R1_brain_trajectory
main: D:/stem/benchmark_data/R1/main.txt
replicates: []

config:
  normalize: log
  max_unit_change: 2
  max_model_profiles: 50
  max_correlation: 1.0
  candidate_cap: 1000000
  n_permutations: 50
  permute_t0: true
  correction: bonferroni
  max_missing: 1
  min_abs_expr: 0.5
  repeat_mode: different_periods
  spot_included: false
  clustering_method: stem

description:
  organism: mus_musculus
  assay: tissue_expression
  preprocessing: |
    Derived from D:/stem/testdata/stem.testdata.tsv (1999 ENSG-Mus-musculus
    genes x 60 multi-stage tissue columns).

    Brain trajectory T=7 in BIOLOGICAL DEVELOPMENTAL ORDER:
      E10.5_Brain, E12.5_Brain, E14.5_Brain, E16.5_Brain,
      P0_Brain, P21_Brain, 8W_Brain (adult).

    Dropped gene_id; kept gene_name as the ID column (spot_included=false).

    The 60 cross-tissue columns are NEVER fed to STEM as a single time-course
    -- the time-course is the 7 Brain columns in biological order.

  # Source TSV (upstream, before Brain-7 selection): 60 columns.
  # Recomputed on disk at run time; this is the canonical anchor.
  source_sha256: 9e6dba16d1dcfcb4ea39226066e7c3bc53c0175888122134e8357285cef54514

  # Analysis main.txt (the 7 Brain columns in developmental order, with
  # gene_id dropped): recomputed on disk at run time; this is what
  # pystemtc.engine.fit() actually reads.
  analysis_input_sha256: ef8e6ae3915c50bcef518d737b915e9e36d83bb2bb02c59cf643b27a105a45ac